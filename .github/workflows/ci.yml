name: CI

on:
  push:
  pull_request:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Test
        run: mvn clean test

      - name: Package
        run: mvn -DskipTests package

      - name: Workflow smoke
        run: |
          set -euo pipefail
          DEMO="$(mktemp -d)"
          JAR="target/dhk-cli-0.1.0-all.jar"
          java -jar "$JAR" memory init --project-root "$DEMO"
          java -jar "$JAR" workflow template seed --project-root "$DEMO"
          START_OUT="$(java -jar "$JAR" workflow start --project-root "$DEMO" --workflow api-change --task "ci smoke" --module order --mode api)"
          RUN_KEY="$(printf '%s\n' "$START_OUT" | awk -F': ' '/run_key/ {print $2}')"
          test -n "$RUN_KEY"
          java -jar "$JAR" workflow status --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" workflow export --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" workflow artifact list --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" workflow summary --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" spec create --project-root "$DEMO" --change ci-smoke --title "CI smoke spec" --summary "Spec smoke" --module order --mode api
          java -jar "$JAR" spec task add --project-root "$DEMO" --change ci-smoke --task T001 --title "Smoke task"
          java -jar "$JAR" spec acceptance add --project-root "$DEMO" --change ci-smoke --acceptance A001 --description "Smoke acceptance"
          java -jar "$JAR" spec bind-workflow --project-root "$DEMO" --change ci-smoke --run "$RUN_KEY" --type implements
          java -jar "$JAR" spec export --project-root "$DEMO" --change ci-smoke
          java -jar "$JAR" memory export --project-root "$DEMO" --task "ci smoke" --module order --include-workflow "$RUN_KEY" --include-spec ci-smoke

      - name: Record jar size
        run: ls -lh target/dhk-cli-0.1.0-all.jar
