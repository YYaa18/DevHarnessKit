name: CI

on:
  push:
  pull_request:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Test
        run: mvn clean test

      - name: Package
        run: mvn -DskipTests package

      - name: Record jar size
        run: ls -lh target/dhk-cli-0.1.0-all.jar
