name: CI

on:
  push:
  pull_request:

jobs:
  maven:
    name: Maven (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '8'
            smoke: false
          - os: ubuntu-latest
            java: '17'
            smoke: true
          - os: windows-latest
            java: '17'
            smoke: false
          - os: macos-latest
            java: '17'
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test
        run: mvn -B clean test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Resolve artifact version
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "DHK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DHK_JAR=target/dhk-cli-$VERSION-all.jar" >> "$GITHUB_ENV"
          echo "DHK_ARCHIVE_PREFIX=target/devharnesskit-$VERSION" >> "$GITHUB_ENV"

      - name: Version metadata gate
        shell: bash
        run: scripts/check-version-metadata.sh "$DHK_VERSION"

      - name: Coverage threshold gate
        shell: bash
        run: scripts/check-coverage-threshold.sh 60

      - name: Version smoke
        shell: bash
        run: java -jar "$DHK_JAR" version

      - name: Workflow smoke
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          DEMO="$(mktemp -d)"
          JAR="$DHK_JAR"
          java -jar "$JAR" memory init --project-root "$DEMO"
          java -jar "$JAR" workflow template seed --project-root "$DEMO"
          START_OUT="$(java -jar "$JAR" workflow start --project-root "$DEMO" --workflow api-change --task "ci smoke" --module order --mode api)"
          RUN_KEY="$(printf '%s\n' "$START_OUT" | awk -F': ' '/run_key/ {print $2}')"
          test -n "$RUN_KEY"
          java -jar "$JAR" workflow status --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" workflow export --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" workflow artifact list --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" workflow summary --project-root "$DEMO" --run "$RUN_KEY"
          java -jar "$JAR" spec create --project-root "$DEMO" --change ci-smoke --title "CI smoke spec" --summary "Spec smoke" --module order --mode api
          java -jar "$JAR" spec task add --project-root "$DEMO" --change ci-smoke --task T001 --title "Smoke task"
          java -jar "$JAR" spec acceptance add --project-root "$DEMO" --change ci-smoke --acceptance A001 --description "Smoke acceptance"
          java -jar "$JAR" spec bind-workflow --project-root "$DEMO" --change ci-smoke --run "$RUN_KEY" --type implements
          java -jar "$JAR" spec export --project-root "$DEMO" --change ci-smoke
          java -jar "$JAR" memory export --project-root "$DEMO" --task "ci smoke" --module order --include-workflow "$RUN_KEY" --include-spec ci-smoke

      - name: Record artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ls -lh "$DHK_JAR" "$DHK_ARCHIVE_PREFIX".*
