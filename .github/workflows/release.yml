name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn -B clean package

      - name: Resolve artifact version
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "DHK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DHK_JAR=target/dhk-cli-$VERSION-all.jar" >> "$GITHUB_ENV"
          echo "DHK_ZIP=target/devharnesskit-$VERSION.zip" >> "$GITHUB_ENV"
          echo "DHK_TGZ=target/devharnesskit-$VERSION.tar.gz" >> "$GITHUB_ENV"

      - name: Version metadata gate
        run: scripts/check-version-metadata.sh "$DHK_VERSION"

      - name: Coverage threshold gate
        run: scripts/check-coverage-threshold.sh 60

      - name: Verify version
        run: java -jar "$DHK_JAR" version

      - name: Generate checksums
        run: |
          cd target
          sha256sum "dhk-cli-$DHK_VERSION-all.jar" "devharnesskit-$DHK_VERSION.zip" "devharnesskit-$DHK_VERSION.tar.gz" > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devharnesskit-${{ env.DHK_VERSION }}
          path: |
            ${{ env.DHK_JAR }}
            ${{ env.DHK_ZIP }}
            ${{ env.DHK_TGZ }}
            target/SHA256SUMS

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DHK_JAR" \
            "$DHK_ZIP" \
            "$DHK_TGZ" \
            target/SHA256SUMS \
            --draft \
            --title "$GITHUB_REF_NAME"
