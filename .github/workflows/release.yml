name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn -B clean package

      - name: Verify version
        run: java -jar target/dhk-cli-0.4.4-beta.1-all.jar version

      - name: Generate checksums
        run: |
          cd target
          sha256sum dhk-cli-0.4.4-beta.1-all.jar devharnesskit-0.4.4-beta.1.zip devharnesskit-0.4.4-beta.1.tar.gz > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devharnesskit-0.4.4-beta.1
          path: |
            target/dhk-cli-0.4.4-beta.1-all.jar
            target/devharnesskit-0.4.4-beta.1.zip
            target/devharnesskit-0.4.4-beta.1.tar.gz
            target/SHA256SUMS

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/dhk-cli-0.4.4-beta.1-all.jar \
            target/devharnesskit-0.4.4-beta.1.zip \
            target/devharnesskit-0.4.4-beta.1.tar.gz \
            target/SHA256SUMS \
            --draft \
            --title "$GITHUB_REF_NAME"
